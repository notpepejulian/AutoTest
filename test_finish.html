<!DOCTYPE html>
<html>
<head>
    <title>Test Finish Function</title>
</head>
<body>
    <h1>Debug Test Finish</h1>
    <button onclick="testFinishFunction()">Test Finish Function</button>
    <div id="result"></div>

    <script>
        // Simulate the test environment
        const API_BASE = 'http://localhost:8000/api';
        
        // Mock data
        const questions = [
            {
                id: 3015,
                texto_pregunta: "¿Test question?",
                respuestas: [
                    {id: 12023, texto_respuesta: "Answer 1", orden_respuesta: 1},
                    {id: 12024, texto_respuesta: "Answer 2", orden_respuesta: 2},
                    {id: 12025, texto_respuesta: "Answer 3", orden_respuesta: 3}
                ]
            },
            {
                id: 3920,
                texto_pregunta: "¿Another test question?",
                respuestas: [
                    {id: 14728, texto_respuesta: "Answer A", orden_respuesta: 1},
                    {id: 14729, texto_respuesta: "Answer B", orden_respuesta: 2},
                    {id: 14730, texto_respuesta: "Answer C", orden_respuesta: 3}
                ]
            }
        ];
        
        // Mock user answers
        const answers = {
            3015: 0, // Selected first answer
            3920: 1  // Selected second answer
        };
        
        async function testFinishFunction() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Copy the validateAnswers function logic
                console.log('Starting validation...');
                console.log('Current answers:', answers);
                console.log('Questions count:', questions.length);
                
                // Prepare answers for backend validation
                const respuestasUsuario = [];
                
                questions.forEach(question => {
                    const userAnswerIndex = answers[question.id];
                    console.log(`Question ${question.id}: user selected index ${userAnswerIndex}`);
                    if (userAnswerIndex !== undefined) {
                        const respuestaId = question.respuestas[userAnswerIndex].id;
                        respuestasUsuario.push({
                            pregunta_id: question.id,
                            respuesta_id: respuestaId
                        });
                        console.log(`Added answer: pregunta_id=${question.id}, respuesta_id=${respuestaId}`);
                    }
                });
                
                console.log('Prepared answers for backend:', respuestasUsuario);
                
                // Send to backend for validation
                console.log('Sending request to backend...');
                const response = await fetch(`${API_BASE}/validar-respuestas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ respuestas: respuestasUsuario })
                });
                
                console.log('Response status:', response.status);
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Backend error:', errorText);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const backendResult = await response.json();
                console.log('Backend result:', backendResult);
                
                resultDiv.innerHTML = `
                    <h3>Success!</h3>
                    <p>Correct: ${backendResult.correctas}/${backendResult.total_preguntas}</p>
                    <p>Percentage: ${backendResult.porcentaje}%</p>
                    <p>Passed: ${backendResult.aprobado ? 'Yes' : 'No'}</p>
                    <pre>${JSON.stringify(backendResult, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
